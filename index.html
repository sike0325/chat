<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claude</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Claude">
<meta name="theme-color" content="#faf9f5">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #faf9f5;
    color: #1f1e1d;
    font-size: 15px;
    line-height: 1.6;
  }

  #header {
    padding: 14px 20px;
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    color: #6b6a67;
    border-bottom: 1px solid #ecebe6;
    background: #faf9f5;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #header .title { flex: 1; }
  #settingsBtn {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    font-size: 18px;
    color: #6b6a67;
    cursor: pointer;
    padding: 4px 8px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    -webkit-overflow-scrolling: touch;
  }

  .row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .row.me { flex-direction: row-reverse; }

  .avatar {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    margin-top: 2px;
    object-fit: cover;
    background: #e8e6df;
  }

  .bubble {
    width: fit-content;
    max-width: 100%;
    padding: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .row.bot .bubble {
    color: #1f1e1d;
    padding-top: 5px;
  }

  .row.me .bubble {
    background: #efece5;
    padding: 10px 14px;
    border-radius: 18px;
    color: #1f1e1d;
  }

  .time {
    font-size: 11px;
    color: #a8a6a0;
    margin-top: 6px;
  }
  .row.me .time { text-align: right; }

  .dots { display: inline-flex; gap: 4px; padding-top: 6px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #d97757;
    animation: bounce 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  #inputBar {
    padding: 12px 16px 16px;
    background: #faf9f5;
    flex-shrink: 0;
  }
  #inputWrap {
    display: flex;
    align-items: flex-end;
    background: #ffffff;
    border: 1px solid #e5e3dc;
    border-radius: 22px;
    padding: 8px 8px 8px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  #input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    font-family: inherit;
    color: #1f1e1d;
    background: transparent;
    padding: 6px 0;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
  }
  #input::placeholder { color: #b0aea8; }

  #send {
    width: 34px; height: 34px;
    border: none;
    border-radius: 50%;
    background: #d97757;
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
  }
  #send:active { transform: scale(0.92); }
  #send:disabled { opacity: 0.4; }

  /* ===== 设置页 ===== */
  #settingsPage {
    position: fixed;
    inset: 0;
    background: #faf9f5;
    z-index: 100;
    display: none;
    flex-direction: column;
  }
  #settingsPage.show { display: flex; }

  #settingsHeader {
    padding: 14px 20px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #ecebe6;
    flex-shrink: 0;
  }
  #settingsHeader .back {
    border: none;
    background: transparent;
    font-size: 16px;
    color: #d97757;
    cursor: pointer;
    padding: 4px 0;
  }
  #settingsHeader .title {
    flex: 1;
    text-align: center;
    font-weight: 500;
    color: #6b6a67;
  }
  #settingsHeader .placeholder {
    width: 40px;
  }

  #settingsBody {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  #settingsBody .label {
    font-size: 13px;
    color: #6b6a67;
    padding: 0 4px;
  }

  #profileText {
    flex: 1;
    width: 100%;
    border: 1px solid #e5e3dc;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.6;
    background: #fff;
    color: #1f1e1d;
    resize: none;
    outline: none;
    min-height: 240px;
  }
  #profileText::placeholder { color: #b0aea8; }

  #saveBtn {
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #d97757;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
  }
  #saveBtn:active { opacity: 0.85; }

  .saveTip {
    text-align: center;
    font-size: 12px;
    color: #a8a6a0;
    min-height: 16px;
  }
</style>
</head>
<body>

  <div id="header">
    <div class="title">Claude</div>
    <button id="settingsBtn">⚙</button>
  </div>

  <div id="messages"></div>

  <div id="inputBar">
    <div id="inputWrap">
      <textarea id="input" rows="1" placeholder="给 Claude 发送消息"></textarea>
      <button id="send">↑</button>
    </div>
  </div>

  <!-- 设置页 -->
  <div id="settingsPage">
    <div id="settingsHeader">
      <button class="back" id="backBtn">‹ 返回</button>
      <div class="title">个人档案</div>
      <div class="placeholder"></div>
    </div>
    <div id="settingsBody">
      <div class="label">用一段话告诉 AI 你是谁、有什么偏好。每次对话它都会带上这段：</div>
      <textarea id="profileText" placeholder="例如：我叫小明，24岁，哈尔滨人，学计算机的。我喜欢简洁直接的回答，别啰嗦。聊技术用中文，其他随意。我平时喜欢打游戏、看动漫..."></textarea>
      <button id="saveBtn">保存</button>
      <div class="saveTip" id="saveTip"></div>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const history = [];

  const AVATAR_ME = '/images/me.jpg';
  const AVATAR_AI = '/images/ai.jpg';

  // ===== 个人档案（存 localStorage） =====
  const PROFILE_KEY = 'claude_profile';
  const settingsPage = document.getElementById('settingsPage');
  const settingsBtn = document.getElementById('settingsBtn');
  const backBtn = document.getElementById('backBtn');
  const profileText = document.getElementById('profileText');
  const saveBtn = document.getElementById('saveBtn');
  const saveTip = document.getElementById('saveTip');

  function loadProfile() {
    return localStorage.getItem(PROFILE_KEY) || '';
  }

  function saveProfile(text) {
    localStorage.setItem(PROFILE_KEY, text);
  }

  settingsBtn.onclick = () => {
    profileText.value = loadProfile();
    saveTip.textContent = '';
    settingsPage.classList.add('show');
  };

  backBtn.onclick = () => {
    settingsPage.classList.remove('show');
  };

  saveBtn.onclick = () => {
    saveProfile(profileText.value);
    saveTip.textContent = '已保存 ✓';
    setTimeout(() => { saveTip.textContent = ''; }, 1500);
  };

  // ===== 聊天 =====
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  function now() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function makeAvatar(src, alt) {
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = src;
    img.alt = alt;
    return img;
  }

  function addMsg(text, who) {
    const row = document.createElement('div');
    row.className = 'row ' + who;

    const avatar = makeAvatar(who === 'me' ? AVATAR_ME : AVATAR_AI, who);

    const right = document.createElement('div');
    right.style.maxWidth = 'calc(100% - 44px)';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = now();

    right.appendChild(bubble);
    right.appendChild(time);
    row.appendChild(avatar);
    row.appendChild(right);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    return { row, bubble, right };
  }

  function addLoading() {
    const row = document.createElement('div');
    row.className = 'row bot';

    const avatar = makeAvatar(AVATAR_AI, 'ai');

    const right = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';

    right.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(right);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  let sending = false;

  async function handleSend() {
    const text = input.value.trim();
    if (!text || sending) return;
    sending = true;
    sendBtn.disabled = true;

    const cleanText = text.replace(/\n+/g, ' ');
    addMsg(cleanText, 'me');
    input.value = '';
    input.style.height = 'auto';
    history.push({ role: 'user', content: cleanText });

    const loadingBubble = addLoading();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: history,
          profile: loadProfile()
        }),
      });
      const data = await res.json();
      loadingBubble.textContent = data.reply;
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      loadingBubble.textContent = '请求失败：' + err.message;
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
    sending = false;
    sendBtn.disabled = false;
  }

  sendBtn.onclick = handleSend;

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
</script>
</body>
</html>
